<!doctype html>
<html dir="rtl" lang="fa">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت</title>
<style>
  :root { --bg:#eef1f5; --ink:#1b2433; --card:#fff; --acc:#0b6e4f; --mut:#6b7686; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12171f; --ink:#e6ebf2; --card:#1b232f; --acc:#3ccf97; --mut:#93a0b2; } }
  body { font-family: Vazirmatn, Tahoma, system-ui, sans-serif; background:var(--bg); color:var(--ink); max-width:560px; margin:0 auto; padding:16px; }
  input, button { font:inherit; padding:11px 12px; border-radius:8px; border:1px solid var(--mut); background:var(--card); color:var(--ink); margin:4px 0; }
  input { width:100%; box-sizing:border-box; }
  button { background:var(--acc); color:#fff; border:0; cursor:pointer; }
  button.d { background:transparent; color:var(--mut); border:1px solid var(--mut); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .c { background:var(--card); padding:12px; border-radius:8px; margin:10px 0; }
  small { color:var(--mut); }
</style>
<h2>پنل مدیریت</h2>
<div id="a"><input id="p" type="password" placeholder="رمز ادمین"><button id="in">ورود</button><small id="e"></small></div>
<div id="m" hidden>
  <div class="c">
    <input id="n" placeholder="نام کاربر">
    <input id="d" type="number" min="1" placeholder="مدت اشتراک (روز) - خالی یعنی نامحدود">
    <button id="mk">ساخت کاربر</button>
  </div>
  <div id="l"></div>
</div>
<script>
const $ = (i) => document.getElementById(i);
let P = sessionStorage.getItem('p') || '';
const H = () => ({ Authorization: 'Bearer ' + P });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

async function load() {
  const r = await fetch('/api/users', { headers: H() });
  if (!r.ok) { $('a').hidden = false; $('m').hidden = true; if (P) $('e').textContent = 'رمز اشتباه است'; return; }
  $('a').hidden = true; $('m').hidden = false;
  const users = await r.json();
  $('l').innerHTML = users.map((x) => {
    const dead = x.exp && Date.now() > x.exp;
    const when = x.exp ? new Date(x.exp).toLocaleDateString('fa-IR') : 'نامحدود';
    return '<div class="c"><b>' + esc(x.name) + '</b> <small>' + (dead ? 'منقضی شده' : 'تا ' + when) + '</small><br>' +
      '<button data-a="k" data-i="' + esc(x.id) + '">کپی لینک اشتراک</button> ' +
      '<button class="d" data-a="d" data-i="' + esc(x.id) + '">حذف</button></div>';
  }).join('') || '<small>هنوز کاربری نساخته‌اید.</small>';
}

$('in').onclick = () => { P = $('p').value; sessionStorage.setItem('p', P); load(); };
$('mk').onclick = async () => {
  await fetch('/api/users', { method: 'POST', headers: H(), body: JSON.stringify({ name: $('n').value, days: +$('d').value || 0 }) });
  $('n').value = ''; $('d').value = ''; load();
};
$('l').onclick = async (e) => {
  const { a, i } = e.target.dataset;
  if (a === 'k') { await navigator.clipboard.writeText(location.origin + '/sub/' + i); e.target.textContent = 'کپی شد'; }
  if (a === 'd') { await fetch('/api/users/' + i, { method: 'DELETE', headers: H() }); load(); }
};
if (P) load();
</script>
